name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end tests (headless Chrome)
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Build the Chrome Web Store package
        run: npm run package

      - name: Upload the Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
