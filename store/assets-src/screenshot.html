<!doctype html>
<!--
  Layouts for the store images, rendered by scripts/store-assets.js at exact
  sizes. `?layout=` picks one: filtered | before-after | popup | promo | icon.
  Texts come from window.__STORE_CONFIG.captions (English or Spanish).
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        overflow: hidden;
      }
      body {
        font-family: system-ui, 'Segoe UI', sans-serif;
        color: #1d1d1f;
        background: #eef2f7;
      }
      .shot {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
      }
      .caption {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 92px;
        padding: 18px 40px 0;
        background: #1a73e8;
        color: #fff;
      }
      .caption h1 {
        margin: 0;
        font-size: 30px;
        font-weight: 700;
      }
      .caption p {
        margin: 4px 0 0;
        font-size: 17px;
        opacity: 0.92;
      }
      .browser {
        position: absolute;
        top: 112px;
        left: 40px;
        border-radius: 10px;
        background: #fff;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
        overflow: hidden;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 12px;
        background: #f1f3f4;
        border-bottom: 1px solid #dadce0;
      }
      .dots span {
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 5px;
        border-radius: 50%;
        background: #dadce0;
      }
      .url {
        flex: 1;
        height: 28px;
        padding: 5px 14px;
        border-radius: 14px;
        background: #fff;
        color: #5f6368;
        font-size: 13px;
      }
      .ext {
        position: relative;
        width: 28px;
        height: 28px;
      }
      .ext img {
        width: 22px;
        height: 22px;
        margin: 3px;
      }
      .badge {
        position: absolute;
        right: -6px;
        bottom: -2px;
        min-width: 18px;
        height: 16px;
        padding: 0 4px;
        border-radius: 8px;
        background: #d93025;
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        line-height: 16px;
        text-align: center;
      }
      iframe {
        display: block;
        border: 0;
        background: #fff;
      }
      .popup {
        position: absolute;
        border-radius: 8px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
        overflow: hidden;
        background: #fff;
      }
      .label {
        position: absolute;
        top: 112px;
        padding: 4px 12px;
        border-radius: 12px;
        color: #fff;
        font-size: 14px;
        font-weight: 700;
      }
      .features {
        position: absolute;
        top: 150px;
        left: 520px;
        right: 50px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .features li {
        position: relative;
        margin: 0 0 26px;
        padding-left: 40px;
        font-size: 22px;
        line-height: 1.3;
      }
      .features li::before {
        content: '✓';
        position: absolute;
        left: 0;
        top: -2px;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #1a73e8;
        color: #fff;
        font-size: 17px;
        line-height: 28px;
        text-align: center;
      }
      .promo {
        display: flex;
        align-items: center;
        gap: 22px;
        width: 440px;
        height: 280px;
        padding: 0 30px;
        background: linear-gradient(135deg, #1a73e8, #0b4fb3);
        color: #fff;
      }
      .promo img {
        width: 104px;
        height: 104px;
        border-radius: 22px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
      }
      .promo h1 {
        margin: 0 0 8px;
        font-size: 34px;
        line-height: 1.05;
      }
      .promo p {
        margin: 0;
        font-size: 17px;
        line-height: 1.3;
        opacity: 0.95;
      }
      .icon {
        width: 128px;
        height: 128px;
        padding: 16px;
        background: transparent;
      }
      .icon img {
        display: block;
        width: 96px;
        height: 96px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const { captions, badge } = window.__STORE_CONFIG;
      const layout = new URLSearchParams(location.search).get('layout');
      const root = document.getElementById('root');
      const icon = '/extension/icons/icon128.png';

      const browser = (left, width, height, src, withBadge) => `
        <div class="browser" style="left:${left}px;width:${width}px;height:${height}px">
          <div class="toolbar">
            <span class="dots"><span></span><span></span><span></span></span>
            <span class="url">diario.example</span>
            <span class="ext"><img src="${icon}" alt="">${withBadge ? `<span class="badge">${badge}</span>` : ''}</span>
          </div>
          <iframe src="${src}" style="width:${width}px;height:${height - 44}px"></iframe>
        </div>`;

      const caption = (title, subtitle) =>
        `<div class="caption"><h1>${title}</h1>${subtitle ? `<p>${subtitle}</p>` : ''}</div>`;

      if (layout === 'filtered') {
        root.innerHTML = `<div class="shot">
          ${caption(captions.filteredTitle, captions.filteredSubtitle)}
          ${browser(40, 1200, 668, '/store/assets-src/demo.html', true)}
          <div class="popup" style="top:166px;right:58px;width:324px;height:600px">
            <iframe src="/extension/popup/popup.html" style="width:324px;height:900px"></iframe>
          </div>
        </div>`;
      } else if (layout === 'before-after') {
        root.innerHTML = `<div class="shot">
          ${caption(captions.beforeAfterTitle, captions.beforeAfterSubtitle)}
          ${browser(40, 590, 668, '/store/assets-src/demo.html?filter=off', false)}
          ${browser(650, 590, 668, '/store/assets-src/demo.html', true)}
          <span class="label" style="left:56px;top:170px;background:#5f6368">${captions.before}</span>
          <span class="label" style="left:666px;top:170px;background:#188038">${captions.after}</span>
        </div>`;
      } else if (layout === 'popup') {
        root.innerHTML = `<div class="shot">
          ${caption(captions.popupTitle, captions.popupSubtitle)}
          <div class="popup" style="top:112px;left:60px;width:420px;height:668px">
            <iframe id="scrolled" src="/extension/popup/popup.html" style="width:324px;height:514px;transform:scale(1.3);transform-origin:0 0"></iframe>
          </div>
          <ul class="features">${captions.features.map((f) => `<li>${f}</li>`).join('')}</ul>
        </div>`;
      } else if (layout === 'promo') {
        document.body.style.background = 'transparent';
        root.innerHTML = `<div class="promo"><img src="${icon}" alt="">
          <div><h1>nomeinteresa</h1><p>${captions.tagline}</p></div></div>`;
      } else if (layout === 'icon') {
        document.body.style.background = 'transparent';
        root.innerHTML = `<div class="icon"><img src="${icon}" alt=""></div>`;
      }
    </script>
  </body>
</html>
