<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <h1 data-i18n="popupTitle"></h1>

    <fieldset>
      <legend data-i18n="popupThisSite"></legend>
      <p id="site" class="site"></p>
      <label class="check"
        ><input id="siteEnabled" type="checkbox" /> <span data-i18n="popupSiteEnabled"></span
      ></label>
    </fieldset>

    <fieldset>
      <legend id="hiddenHeading"></legend>
      <p id="hiddenEmpty" class="note"></p>
      <ol id="hiddenList" class="hidden-list" aria-labelledby="hiddenHeading"></ol>
    </fieldset>

    <fieldset>
      <legend data-i18n="popupKeywords"></legend>
      <textarea id="keywords" rows="8" spellcheck="false" aria-describedby="keywordsHelp"></textarea>
      <p id="keywordsHelp" class="note" data-i18n="popupKeywordsHelp"></p>
      <p class="presets-label" data-i18n="popupAddPreset"></p>
      <div id="presets" class="presets"></div>
    </fieldset>

    <p id="status" role="status" aria-live="polite"></p>
  </body>
</html>
